name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test local and cloud storage
        run: make test
      - name: Build native app
        run: ./scripts/build-app.sh
  mlx-test-and-build:
    runs-on: macos-26
    env:
      OPENFILES_MLX: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Show Xcode and Swift versions (Swift 6.3+ required)
        run: |
          xcodebuild -version
          xcrun swift --version
      - name: Test retrieval integration (model download is opt-in)
        run: make test
      - name: Build app and Metal resources
        run: make build
