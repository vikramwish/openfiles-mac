name: macOS
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Test core
        run: swift run --build-system native OpenFilesChecks
      - name: Build native app
        run: ./scripts/build-app.sh
